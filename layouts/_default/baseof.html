<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ .Title }}</title>
  <link rel="canonical" href="{{ .Permalink }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Lora', Cambria, Georgia, serif;
      background: #f3f3f3;
      color: #999;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      text-align: center;
      padding: 40px 20px;
      max-width: 500px;
      width: 100%;
    }

    .photo {
      width: 200px;
      height: 200px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 30px;
    }

    .photo-placeholder {
      width: 200px;
      height: 200px;
      border-radius: 50%;
      background: #ddd;
      margin: 0 auto 30px;
    }

    h1 {
      font-size: 2.6rem;
      font-weight: 400;
      color: #000;
      line-height: 1.4;
      letter-spacing: 0;
      margin-bottom: 30px;
    }

    h2 {
      font-size: 1.4rem;
      font-weight: 400;
      color: #000;
      line-height: 1.6;
      margin-bottom: 30px;
    }

    h2 a {
      color: inherit;
      text-decoration: none;
    }

    .typing-cursor {
      display: inline-block;
      width: 2px;
      background: #000;
      margin-left: 2px;
      animation: blink 1s step-end infinite;
    }

    @keyframes blink {
      50% { opacity: 0; }
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 16px;
      align-items: center;
    }

    .link-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      max-width: 400px;
      padding: 14px 20px;
      border-radius: 0.7em;
      color: #fff;
      text-decoration: none;
      font-family: 'Lora', Cambria, Georgia, serif;
      font-size: 1.1rem;
      transition: opacity 0.2s ease;
    }

    .link-btn:hover { opacity: 0.85; }

    .link-btn svg {
      width: 24px;
      height: 24px;
      fill: currentColor;
      flex-shrink: 0;
    }

    .linkedin { background: #0077B5; }
    .bluesky { background: #3986f6; }

    .save-contact {
      background: #333;
      border: none;
      cursor: pointer;
      font-family: 'Lora', Cambria, Georgia, serif;
    }
  </style>
</head>
<body>
  {{ block "main" . }}{{ end }}

  <script>
  (function () {
    var el = document.getElementById('typed-name');
    if (!el) return;
    var text = el.getAttribute('data-text');
    var cursor = document.getElementById('typed-cursor');
    el.textContent = '';
    var i = 0;
    function type() {
      if (i < text.length) {
        el.textContent += text.charAt(i);
        i++;
        setTimeout(type, 150);
      } else if (cursor) {
        setTimeout(function () { cursor.style.display = 'none'; }, 1800);
      }
    }
    type();
  })();

  (function () {
    var btn = document.getElementById('saveContact');
    if (!btn) return;

    var photoB64 = null;
    var xhr = new XMLHttpRequest();
    xhr.open('GET', '/images/amber-hollister.jpg', true);
    xhr.responseType = 'blob';
    xhr.onload = function () {
      if (xhr.status < 200 || xhr.status >= 300) return;
      var reader = new FileReader();
      reader.onloadend = function () {
        photoB64 = reader.result.split(',')[1] || null;
      };
      reader.readAsDataURL(xhr.response);
    };
    xhr.send();

    btn.addEventListener('click', function () {
      var days = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
      var months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
      var now = new Date();
      var metDate = days[now.getDay()] + '\, ' + months[now.getMonth()] + ' ' + now.getDate() + '\, ' + now.getFullYear();

      var lines = [
        'BEGIN:VCARD',
        'VERSION:3.0',
        'N:Hollister;Amber;;;',
        'FN:Amber Hollister',
        'ORG:Hope & Healing JAX',
        'TITLE:Director of Operations',
        'TEL;TYPE=WORK,VOICE:+19046015637',
        'EMAIL;TYPE=WORK:ahollister@hopeandhealingjax.org',
        'URL:https://hopeandhealingjax.org',
        'item1.URL:https://www.facebook.com/hopeandhealingjax/',
        'item1.X-ABLabel:Facebook',
        'item2.URL:https://www.instagram.com/hopeandhealing_jax/',
        'item2.X-ABLabel:Instagram',
        'item3.URL:https://www.linkedin.com/in/amber-jolly-hollister',
        'item3.X-ABLabel:LinkedIn',
        'item4.URL:https://bsky.app/profile/amberhollister.com',
        'item4.X-ABLabel:Bluesky',
        'NOTE:Met Amber on ' + metDate
      ];
      if (photoB64) {
        lines.push('PHOTO;ENCODING=b;TYPE=JPEG:' + photoB64);
      }
      lines.push('END:VCARD');

      var vcf = lines.join('\r\n');
      var blob = new Blob([vcf], { type: 'text/vcard' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = 'Amber_Hollister_Hope_Healing_JAX.vcf';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    });
  })();
  </script>
</body>
</html>
